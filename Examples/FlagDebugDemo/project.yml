# A tiny iOS app, the only one linking StorybookKit, that shows FeatureFlagKitUI's previews.
# XcodeGen turns this into FlagDebugDemo.xcodeproj, which git ignores.
# cspell:ignore mayjournal AMPJZXR
name: FlagDebugDemo
options:
  bundleIdPrefix: com.mayjournal
  deploymentTarget:
    iOS: "26.0"
packages:
  FeatureFlagKit:
    path: ../..
  Storybook:
    url: https://github.com/eure/swift-storybook
    from: 3.3.0
targets:
  FlagDebugDemo:
    type: application
    platform: iOS
    sources: [FlagDebugDemo]
    # A shared scheme, so xcodebuild finds FlagDebugDemo on a clean checkout.
    scheme: {}
    dependencies:
      - package: FeatureFlagKit
        product: FeatureFlagKitUI
      - package: Storybook
        product: StorybookKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        # The owner's individual team; the Makefile's demo target builds without it.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AMPJZXR538
        # Keeps every preview in the static FeatureFlagKitUI library linked, for the storybook.
        OTHER_LDFLAGS: $(inherited) -all_load
